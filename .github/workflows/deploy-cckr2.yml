name: Deploy to CCKR2 (Production)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cckr2.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID_CCKR2: ${{ secrets.VERCEL_PROJECT_ID_CCKR2 }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cckr2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "deploy" ]; then
            echo "❌ Invalid confirmation. Type 'deploy' to confirm."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (CCKR2)
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --alias=project-yidb6.vercel.app

      - name: Notify deployment
        run: |
          echo "✅ CCKR2 Production Deployed"
          echo "🌐 https://project-yidb6.vercel.app"
          echo "📦 Commit: ${{ github.sha }}"